name: PSP Build

on:
  push:
    branches: [ "main", "master", "release/**" ]
  pull_request:
    branches: [ "main", "master", "release/**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build EBOOT.PBP
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Smoke checks
      run: make smoke

    - name: Build ME helper PRX
      run: |
        cd moonlight_me_helper
        make -j$(nproc)

    - name: Build main application (retail)
      run: make -j$(nproc) RETAIL_BUILD=1

    - name: Verify outputs
      run: |
        ls -lh EBOOT.PBP moonlight.prx moonlight_me_helper/moonlight_me_helper.prx
        echo "Build successful."

    - name: Upload CI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: moonlight-psp-ci-${{ github.sha }}
        path: |
          EBOOT.PBP
          moonlight_me_helper/moonlight_me_helper.prx
        if-no-files-found: error

